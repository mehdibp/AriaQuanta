[pytest]
# This file sits in the repository root (the folder that IS the `AriaQuanta` package), so the
# folder one level up must be importable for `import AriaQuanta` to work.
pythonpath = .
testpaths = tests
addopts = --import-mode=importlib -ra
markers =
    slow: long-running tests (deselect with -m "not slow")
    qiskit: cross-checks against Qiskit (skipped automatically when qiskit is not installed)
